services:
  - type: web
    name: harmony-booking-bot-new
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DARINA_ID
        sync: false
      - key: ANASTASIA_ID
        value: "6140181153"
      - key: DB_PATH
        value: "harmony.db"
